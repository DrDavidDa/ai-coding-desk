<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <title>Desk154 — desk / usage / moyu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #14110e; color: #ebe4d6; font-family: Bahnschrift, "Segoe UI Variable Display", "PingFang SC", "Microsoft YaHei", sans-serif; }
    body { padding: 36px 40px 72px; }
    .kicker { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: #9a8f7e; }
    h1 { font-weight: 400; font-size: 28px; letter-spacing: -0.03em; margin: 8px 0 10px; }
    .lede { color: #c4b8a6; font-size: 15px; line-height: 1.55; max-width: 56em; }
    .row { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 32px; }
    .cut { width: 240px; }
    .tag { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #9a8f7e; margin-bottom: 10px; }
    .tag em { font-style: normal; color: #e8b07a; }
    .puck { width: 240px; height: 240px; border-radius: 18px; overflow: hidden; cursor: pointer; box-shadow: 0 18px 40px rgba(0,0,0,.45); }
    .note { margin-top: 10px; font-size: 12px; color: #8a8072; line-height: 1.45; }
  </style>
</head>
<body>
  <div class="kicker">Desk154 · 240×240</div>
  <h1>首页是工作台，木鱼是电子木鱼</h1>
  <p class="lede">不再用 IDLE 占一整页。第一页是上一句转写 + TALK / STOP。左滑是额度。再左滑才是隐藏木鱼：点一下 +1 上飘，连敲出 combo，晃一下也算敲。</p>
  <div class="row">
    <figure class="cut">
      <div class="tag">1 · <em>desk</em></div>
      <div class="puck" id="desk"></div>
      <p class="note">有用的是上一句话。RUN 只在干活时出现一小行。两块键就是手。</p>
    </figure>
    <figure class="cut">
      <div class="tag">2 · usage</div>
      <div class="puck" id="usage"></div>
      <p class="note">四家 Plan。</p>
    </figure>
    <figure class="cut">
      <div class="tag">3 · <em>hidden</em> · 电子木鱼</div>
      <div class="puck" id="moyu"></div>
      <p class="note">点或晃。功德数在顶上。长按清零。没有 108 进度环。</p>
    </figure>
  </div>
  <script>
    const E = {
      bg: "#100e0c", void: "#120c08", ink: "#f1e6d4", mute: "#8d8274",
      copper: "#d4a06a", hot: "#c45c3a", well: "#2a2622",
      wood: "#8b5a2b", wooddk: "#3d2414", woodlt: "#d4a06a"
    };
    function canvas(el) {
      const c = document.createElement("canvas");
      c.width = 240; c.height = 240;
      el.appendChild(c);
      return c.getContext("2d");
    }
    function dots(g, i) {
      for (let n = 0; n < 2; n++) {
        g.fillStyle = n === i ? E.copper : E.well;
        g.fillRect(112 + (n - 0.5) * 16 - (n === i ? 6 : 2.5), 228, n === i ? 12 : 5, 4);
      }
    }
    function paintDesk(g, i) {
      const lines = ["hold PLUS", "把登录改成 JWT", "cursor · agents"];
      const kick = ["", "", "RUN"];
      g.fillStyle = E.bg; g.fillRect(0, 0, 240, 240);
      g.fillStyle = E.copper; g.fillRect(0, 0, 4, 240);
      g.fillStyle = E.copper; g.font = "11px Bahnschrift, sans-serif";
      if (kick[i]) g.fillText(kick[i], 18, 26);
      g.fillStyle = E.ink; g.font = "16px Bahnschrift, sans-serif";
      g.fillText(lines[i], 18, 54);
      g.fillStyle = E.hot; g.fillRect(16, 92, 208, 68);
      g.fillStyle = "#fff"; g.font = "400 32px Bahnschrift, sans-serif";
      g.fillText("TALK", 120 - g.measureText("TALK").width / 2, 136);
      g.fillStyle = E.copper; g.fillRect(16, 166, 208, 68);
      g.fillStyle = E.bg;
      g.fillText("STOP", 120 - g.measureText("STOP").width / 2, 210);
    }
    function paintUsage(g) {
      const ROWS = [["CURSOR", 0.37], ["GLM", 1], ["CLAUDE", 0.42], ["CODEX", 0.17]];
      g.fillStyle = E.bg; g.fillRect(0, 0, 240, 240);
      g.fillStyle = E.hot; g.fillRect(0, 0, 4, 240);
      g.fillStyle = E.mute; g.font = "11px Bahnschrift, sans-serif"; g.fillText("PLAN", 18, 28);
      g.fillStyle = E.ink; g.font = "20px Bahnschrift, sans-serif"; g.fillText("USAGE", 18, 50);
      ROWS.forEach((r, i) => {
        const y = 66 + i * 38;
        g.fillStyle = E.mute; g.font = "11px Bahnschrift, sans-serif"; g.fillText(r[0], 18, y + 8);
        g.fillStyle = E.well; g.fillRect(18, y + 16, 204, 10);
        g.fillStyle = r[1] >= 0.9 ? E.hot : E.copper; g.fillRect(18, y + 16, 204 * r[1], 10);
        g.fillStyle = r[1] >= 0.9 ? E.hot : E.ink; g.font = "20px Bahnschrift, sans-serif";
        const n = Math.round(r[1] * 100) + "%";
        g.fillText(n, 222 - g.measureText(n).width, y + 10);
      });
      dots(g, 1);
    }
    function paintMoyu(g, n, squash, plusY, combo) {
      g.fillStyle = E.void; g.fillRect(0, 0, 240, 240);
      g.fillStyle = E.woodlt; g.font = "400 36px Bahnschrift, sans-serif";
      const s = String(n);
      g.fillText(s, 120 - g.measureText(s).width / 2, 42);
      if (combo >= 2) {
        g.fillStyle = E.hot; g.font = "16px Bahnschrift, sans-serif";
        g.fillText("x" + combo, 196, 32);
      }
      const sc = squash ? 0.86 : 1;
      const cx = 120, cy = 138, r = 74 * sc;
      g.fillStyle = E.wood; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
      g.fillStyle = E.wooddk; g.beginPath(); g.arc(cx, cy, r * 0.76, 0, Math.PI * 2); g.fill();
      g.fillStyle = E.void;
      g.beginPath(); g.roundRect(cx - 27, cy - 8, 54, 10, 4); g.fill();
      g.fillStyle = E.woodlt; g.beginPath(); g.arc(cx - 22, cy - 16, 7, 0, Math.PI * 2); g.fill();
      if (plusY != null) {
        g.globalAlpha = Math.max(0, 1 - plusY / 70);
        g.fillStyle = E.woodlt; g.font = "20px Bahnschrift, sans-serif";
        g.fillText("+1", 108, cy - 40 - plusY);
        g.globalAlpha = 1;
      }
    }
    const desk = document.getElementById("desk");
    const gd = canvas(desk);
    let di = 0;
    paintDesk(gd, 0);
    desk.onclick = () => { di = (di + 1) % 3; paintDesk(gd, di); };
    const usage = document.getElementById("usage");
    paintUsage(canvas(usage));
    const moyu = document.getElementById("moyu");
    const gm = canvas(moyu);
    let n = 0, combo = 0, last = 0;
    function draw(squash, plusY) { paintMoyu(gm, n, squash, plusY, combo); }
    draw(false, null);
    moyu.onclick = () => {
      const now = Date.now();
      combo = now - last < 900 ? combo + 1 : 1;
      last = now;
      n += 1;
      draw(true, 0);
      let t = 0;
      const id = setInterval(() => {
        t += 30;
        draw(t < 90, t);
        if (t >= 420) { clearInterval(id); draw(false, null); }
      }, 30);
    };
  </script>
</body>
</html>
